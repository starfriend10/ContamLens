    graphDiv.style.minHeight = "100%";
    
    
    /* =====================================================
       Numeric conversion
    ====================================================== */
    
    function asNumber(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }
        
        const numericValue = Number(value);
        
        if (!Number.isFinite(numericValue)) {
            return null;
        }
        
        return numericValue;
    }
    
    
    /* =====================================================
       Integer conversion
    ====================================================== */
    
    function asInteger(value) {
        const numericValue = asNumber(value);
        
        if (numericValue === null) {
            return null;
        }
        
        return Math.round(
            numericValue
        );
    }
    
    
    /* =====================================================
       Read information prepared in Python customdata
    ====================================================== */
    
    function buildInformation(point) {
        if (!point) {
            return null;
        }
        
        const customdata = point.customdata;
        
        if (
            Array.isArray(customdata) &&
            customdata.length >= 7
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",
                
                path:
                    customdata[1]
                    || point.label
                    || "Unknown category",
                
                frequency:
                    asNumber(
                        customdata[2]
                    ),
                
                parentShare:
                    asNumber(
                        customdata[3]
                    ),
                
                panelShare:
                    asNumber(
                        customdata[4]
                    ),
                
                hierarchyLevel:
                    asInteger(
                        customdata[5]
                    ),
                
                subcategoryCount:
                    asInteger(
                        customdata[6]
                    )
            };
        }
        
        
        /*
         Compatibility fallback for an older five-field
         customdata structure.
        */
        if (
            Array.isArray(customdata) &&
            customdata.length >= 5
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",
                
                path:
                    customdata[1]
                    || point.label
                    || "Unknown category",
                
                frequency:
                    asNumber(
                        customdata[2]
                    ),
                
                parentShare:
                    asNumber(
                        customdata[3]
                    ),
                
                panelShare:
                    asNumber(
                        customdata[4]
                    ),
                
                hierarchyLevel:
                    null,
                
                subcategoryCount:
                    null
            };
        }
        
        
        /*
         Final fallback if no customdata is available.
        */
        return {
            name:
                point.label
                || "Unknown category",
            
            path:
                point.label
                || "Unknown category",
            
            frequency:
                asNumber(
                    point.value
                ),
            
            parentShare:
                null,
            
            panelShare:
                null,
            
            hierarchyLevel:
                null,
            
            subcategoryCount:
                null
        };
    }
    
    
    /* =====================================================
       Send interactions to the parent webpage
    ====================================================== */
    
    function sendInteraction(
        action,
        information
    ) {
        if (
            !window.parent ||
            window.parent === window
        ) {
            return;
        }
        
        window.parent.postMessage(
            {
                type:
                    "panel-sunburst-interaction",
                
                action:
                    action,
                
                information:
                    information
            },
            "*"
        );
    }
    
    
    /* =====================================================
       Hover interaction
    ====================================================== */
    
    graphDiv.on(
        "plotly_hover",
        function (eventData) {
            if (
                !eventData ||
                !eventData.points ||
                eventData.points.length === 0
            ) {
                return;
            }
            
            const information =
                buildInformation(
                    eventData.points[0]
                );
            
            if (information) {
                sendInteraction(
                    "hover",
                    information
                );
            }
        }
    );
    
    
    graphDiv.on(
        "plotly_unhover",
        function () {
            sendInteraction(
                "unhover",
                null
            );
        }
    );
    
    
    /* =====================================================
       Click interaction
    ====================================================== */
    
    graphDiv.on(
        "plotly_click",
        function (eventData) {
            if (
                !eventData ||
                !eventData.points ||
                eventData.points.length === 0
            ) {
                return;
            }
            
            const information =
                buildInformation(
                    eventData.points[0]
                );
            
            if (information) {
                sendInteraction(
                    "click",
                    information
                );
            }
        }
    );
    
    
    /* =====================================================

    ====================================================== */
    
    let resizeTimer = null;
    
    function resizePlot() {
        window.clearTimeout(
            resizeTimer
        );
        
        resizeTimer = window.setTimeout(
            function () {
                window.requestAnimationFrame(
                    function () {
                        try {
                            Plotly.Plots.resize(
                                graphDiv
                            );
                        } catch (error) {
                            console.warn(
                                "Plotly resize failed:",
                                error
                            );
                        }
                    }
                );
            },
            20
        );
    }
    
    
    window.addEventListener(
        "resize",
        resizePlot
    );
    
    
    window.addEventListener(
        "message",
        function (event) {
            const message = event.data;
            
            if (!message) {
                return;
            }
            
            if (
                message.type ===
                    "panel-sunburst-resize"
                ||
                message.type ===
                    "resize"
            ) {
                resizePlot();
                
                window.setTimeout(
                    resizePlot,
                    120
                );
                
                window.setTimeout(
                    resizePlot,
                    350
                );
            }
        }
    );
    
    
    if (
        typeof ResizeObserver !== "undefined"
    ) {
        const resizeObserver =
            new ResizeObserver(
                function () {
                    resizePlot();
                }
            );
        
        resizeObserver.observe(
            document.body
        );
        
        resizeObserver.observe(
            graphDiv
        );
    }
    
    
    window.setTimeout(
        resizePlot,
        40
    );
    
    window.setTimeout(
        resizePlot,
        220
    );
    
    window.setTimeout(
        resizePlot,
        600
    );
