    /* =====================================================
       Numeric conversion
    ====================================================== */
    
    function asNumber(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }
        
        const numericValue = Number(value);
        
        if (!Number.isFinite(numericValue)) {
            return null;
        }
        
        return numericValue;
    }
    
    
    /* =====================================================
       Integer conversion
    ====================================================== */
    
    function asInteger(value) {
        const numericValue = asNumber(value);
        
        if (numericValue === null) {
            return null;
        }
        
        return Math.round(
            numericValue
        );
    }
    
    
    /* =====================================================
       Read information prepared in Python customdata
    ====================================================== */
    
    function buildInformation(point) {
        if (!point) {
            return null;
        }
        
        const customdata = point.customdata;
        
        if (
            Array.isArray(customdata) &&
            customdata.length >= 7
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",
                
                path:
                    customdata[1]
                    || point.label
                    || "Unknown category",
                
                frequency:
                    asNumber(
                        customdata[2]
                    ),

                    asNumber(
                        customdata[3]
                    ),
                
                panelShare:
                    asNumber(
                        customdata[4]
                    ),
                
                hierarchyLevel:
                    asInteger(
                        customdata[5]
                    ),
                
                subcategoryCount:
                    asInteger(
                        customdata[6]
                    )
            };
        }
        
        
        /*

            Array.isArray(customdata) &&

                name:
                    customdata[0]
