    /* =====================================================

    ====================================================== */
    
    function asNumber(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }
        
        const numericValue = Number(value);
        
        if (!Number.isFinite(numericValue)) {
            return null;
        }
        
        return numericValue;
    }
    
    
    /* =====================================================
       Integer conversion
    ====================================================== */
    
    function asInteger(value) {
        const numericValue = asNumber(value);
        
        if (numericValue === null) {
            return null;
        }
        
        return Math.round(
            numericValue
        );
    }
    
    
    /* =====================================================

    ====================================================== */
    
    function buildInformation(point) {
        if (!point) {
            return null;
        }
        
        const customdata = point.customdata;
        
        if (
            Array.isArray(customdata) &&
            customdata.length >= 7
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",

                    customdata[1]
                    || point.label

                frequency:

                    asNumber(
                        customdata[3]
                    ),
                
                panelShare:
                    asNumber(
                        customdata[4]
                    ),
                
                hierarchyLevel:
                    asInteger(
                        customdata[5]
                    ),
                
                subcategoryCount:
                    asInteger(
                        customdata[6]
                    )
            };
        }

                    customdata[0]
