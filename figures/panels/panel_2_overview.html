    /* =====================================================
       Numeric conversion
    ====================================================== */
    
    function asNumber(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }
        
        const numericValue = Number(value);
        
        if (!Number.isFinite(numericValue)) {
            return null;
        }
        
        return numericValue;
    }
    
    
    /* =====================================================
       Integer conversion
    ====================================================== */
    
    function asInteger(value) {
        const numericValue = asNumber(value);
        
        if (numericValue === null) {
            return null;
        }
        
        return Math.round(
            numericValue
        );
    }
    
    
    /* =====================================================
       Read information prepared in Python customdata
    ====================================================== */
    
    function buildInformation(point) {
        if (!point) {
            return null;
        }
        
        const customdata = point.customdata;
        
        if (
            Array.isArray(customdata) &&
            customdata.length >= 7
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",
                
                path:
                    customdata[1]
                    || point.label
                    || "Unknown category",
                
                frequency:
                    asNumber(
                        customdata[2]
                    ),
                
                parentShare:
                    asNumber(
                        customdata[3]
                    ),
                
                panelShare:
                    asNumber(
                        customdata[4]
                    ),
                
                hierarchyLevel:
                    asInteger(
                        customdata[5]
                    ),
                
                subcategoryCount:
                    asInteger(
                        customdata[6]
                    )
            };
        }
        
        
        /*

        */
        if (
            Array.isArray(customdata) &&
            customdata.length >= 5
        ) {
            return {
                name:
                    customdata[0]
                    || point.label
                    || "Unknown category",
                
                path:
                    customdata[1]

                frequency:
                    asNumber(
                        customdata[2]

                    asNumber(

            hierarchyLevel:
                null,
            
            subcategoryCount:
                null

    }
    
    
    /* =====================================================

    function sendInteraction(

            window.parent === window

            return;
        }

                information:
                    information
            },
            "*"
        );
    }

                return;

            if (information) {
                sendInteraction(
                    "hover",
                    information
                );
            }
        }
